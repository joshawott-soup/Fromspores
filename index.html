h1,h2,h3{margin:0;line-height:1.1;font-weight:700}
.px{font-family:var(--px);letter-spacing:.02em}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.9rem}
.lead{color:var(--muted);margin-top:8px;max-width:60ch}
:where(button,input,select,textarea,canvas,a):focus-visible{outline:4px dashed var(--sun);outline-offset:3px}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}

/* chunky pixel-notched boxes */
.panel{position:relative;margin:4px;padding:18px;background:var(--parch);color:var(--ink);box-shadow:0 -4px 0 0 var(--plum),0 4px 0 0 var(--plum),-4px 0 0 0 var(--plum),4px 0 0 0 var(--plum),0 8px 0 0 rgba(0,0,0,.3),inset -4px -4px 0 0 rgba(42,23,69,.1)}
.ribbon{font-family:var(--px);font-size:1.25rem;color:#fff;background:var(--pink);margin:-18px -18px 14px;padding:8px 14px;text-align:center;text-shadow:2px 2px 0 var(--plum);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.btn{font-family:var(--px);font-weight:700;font-size:1.05rem;line-height:1.15;padding:8px 16px;margin:4px;border:0;background:var(--parch2);color:var(--ink);cursor:pointer;
 box-shadow:0 -4px 0 0 var(--plum),0 4px 0 0 var(--plum),-4px 0 0 0 var(--plum),4px 0 0 0 var(--plum),inset -4px -4px 0 0 rgba(42,23,69,.25),inset 4px 4px 0 0 rgba(255,255,255,.45);transition:transform .08s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn:active{transform:translateY(3px);box-shadow:0 -4px 0 0 var(--plum),0 4px 0 0 var(--plum),-4px 0 0 0 var(--plum),4px 0 0 0 var(--plum),inset 4px 4px 0 0 rgba(42,23,69,.25)}
.btn.primary{background:var(--sun)}.btn.good{background:var(--mint)}.btn.danger{background:#ffb3a8;color:#5a1010}.btn.small{font-size:.9rem;padding:5px 11px}.btn.big{font-size:1.25rem;padding:12px 22px}
.btn.ghost{background:transparent;box-shadow:none;text-decoration:underline wavy;text-underline-offset:4px;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:#c2185b;text-decoration:underline wavy;text-underline-offset:3px;cursor:pointer}
.chipbtn{font-family:var(--px);font-size:1rem;padding:3px 12px;margin:2px;border:0;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 0 0 3px var(--plum)}
.chipbtn[aria-pressed="true"]{background:var(--sun);transform:translateY(-2px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{flex:1}
.fld{display:grid;gap:5px;margin:12px 0}.fld>span{font-family:var(--px);font-size:1.05rem}
.fld small{color:var(--muted);font-size:.9rem}
input,select,textarea{font:inherit;font-size:1rem;padding:9px 12px;border:0;background:#fff;color:var(--ink);width:100%;box-shadow:0 0 0 3px var(--plum),inset 3px 3px 0 0 rgba(42,23,69,.14)}
input[type=checkbox]{width:auto}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
.err{color:#b3123f;font-weight:800;min-height:1.4em;margin-top:6px}
.note{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.warn{background:#ffe08a;border:0;padding:10px 14px;margin-top:12px;color:var(--ink);box-shadow:0 0 0 3px var(--plum)}
.secbox{background:#d2f7e6;padding:10px 14px;margin-top:14px;font-size:.98rem;box-shadow:0 0 0 3px var(--plum)}
.secbox ul{margin:6px 0 0;padding-left:1.2rem}.secbox li{margin:3px 0}
.pill{font-family:var(--px);font-size:.85rem;padding:2px 10px;background:var(--sun);color:var(--ink);box-shadow:0 0 0 3px var(--plum)}
.pill.good{background:#a6f0d2}
.bar{height:22px;background:#fff;box-shadow:0 0 0 3px var(--plum);overflow:hidden}
.bar>span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--mint) 0 8px,#33c493 8px 16px);transition:width .5s steps(12)}
.bar.hp>span{background:repeating-linear-gradient(90deg,var(--coral) 0 8px,#ff8f7d 8px 16px)}

/* header */
.top{background:rgba(23,12,51,.72);box-shadow:0 4px 0 0 var(--plum)}
.top-in{max-width:1180px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:6px}.brand .px{font-size:clamp(1.3rem,4.5vw,2.3rem);color:var(--sun);text-shadow:3px 3px 0 var(--plum),0 0 18px rgba(255,210,63,.35)}
.logo{width:64px;height:64px;animation:bob 2.2s steps(4) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.who{display:flex;align-items:center;gap:8px}.hdr-user{color:#cbbcff;font-weight:700}
.site{max-width:1180px;margin:0 auto;padding:0 18px 90px;position:relative;z-index:1}
.banner{margin:18px 4px 0;padding:10px 14px;background:var(--sun);color:var(--ink);font-family:var(--px);box-shadow:0 0 0 4px var(--plum)}

/* totals */
.strip{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.gem{background:var(--night2);color:#fff;padding:10px 14px;box-shadow:0 0 0 4px #150a30,inset -4px -4px 0 0 rgba(0,0,0,.25),inset 4px 4px 0 0 rgba(255,255,255,.08)}
.gem span{display:block;font-size:.82rem;color:#cbbcff;font-weight:700}.gem b{font-family:var(--px);font-size:1.55rem}
.gem.hot b{color:#ff9f8f}

/* the arena: nursery on the left, caves on the right */
.arena{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;align-items:start;margin-top:30px}
.nursery .nur-sub{margin-bottom:8px}
.qty{margin-bottom:10px}
.nur-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.hatch{font:inherit;border:0;background:#fff;color:var(--ink);padding:6px 4px 8px;cursor:pointer;display:grid;justify-items:center;gap:0;box-shadow:0 0 0 3px var(--plum),inset -3px -3px 0 0 rgba(42,23,69,.14);transition:transform .1s}
.hatch:hover{transform:translateY(-3px) rotate(-1.5deg);background:#fff9e6}
.hatch:active{transform:translateY(2px)}
.hatch canvas{width:64px;height:64px}
.hatch b{font-family:var(--px);font-size:1.15rem}.hatch span{font-size:.8rem;color:#c2185b;font-weight:800}
.tip{margin-top:12px;color:var(--muted);font-size:.9rem}
.tabs{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tabrow{display:flex;flex-wrap:wrap;gap:10px}
.tab{font-family:var(--px);font-size:1rem;padding:6px 14px 6px 10px;border:0;background:#4a3590;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 0 0 3px #150a30,inset -3px -3px 0 rgba(0,0,0,.25);transition:transform .1s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-pressed="true"]{background:var(--sun);color:var(--ink);transform:translateY(-3px);box-shadow:0 0 0 3px var(--plum),inset -3px -3px 0 rgba(42,23,69,.2)}
.tab i{width:12px;height:12px;display:inline-block;box-shadow:0 0 0 2px var(--plum)}
.t0 i{background:#7fe8f5}.t1 i{background:#ff9a3a}.t2 i{background:#7dffb4}.t3 i{background:#d69cff}
.tab.add{background:transparent;color:#cbbcff;box-shadow:0 0 0 3px #6f5cc0;border:0}
.arrows{display:flex}
.cave-frame{background:#0b0716;margin:4px;box-shadow:0 -4px 0 0 var(--plum),0 4px 0 0 var(--plum),-4px 0 0 0 var(--plum),4px 0 0 0 var(--plum),0 0 0 8px #ffd23f66,0 12px 0 4px rgba(0,0,0,.35)}
#cave{display:block;width:100%;height:auto;aspect-ratio:384/216;cursor:default;touch-action:manipulation}
#info{margin-top:26px}
.info-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.info h2{font-size:1.9rem;margin-top:6px}
.badge{font-family:var(--px);font-size:.85rem;padding:2px 10px;color:#fff;box-shadow:0 0 0 3px var(--plum)}
.badge.k-savings{background:#2f9e72}.badge.k-spending{background:#d9622b}
.worth{text-align:right}.worth small{display:block;color:var(--muted);font-weight:700}
.worth b{display:block;font-family:var(--px);font-size:2.6rem;line-height:1;color:#b3123f}
.sub{font-family:var(--px);font-size:1.1rem;margin:16px 0 8px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.chip{background:#fff;text-align:center;padding:8px 6px 10px;box-shadow:0 0 0 3px var(--plum),inset -3px -3px 0 rgba(42,23,69,.1)}
.chip canvas{width:64px;height:64px;display:block;margin:0 auto}
.chip b{font-family:var(--px);font-size:1.5rem;display:block}.chip>span{font-size:.85rem;color:var(--muted);font-weight:700}
.chip.none canvas{opacity:.35;filter:grayscale(.6)}
.pm{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:6px}.pm em{font-style:normal;font-size:.8rem;min-width:5.2em;font-weight:800}
.pm .btn{margin:2px}
.acts{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}
.deploy{margin-top:16px;padding:12px;background:#ffe2f0;box-shadow:0 0 0 3px var(--plum);display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.picked{flex:1 1 100%;font-weight:800}
.deploy .tgt{margin:0;flex:1 1 220px}
.deploy .note{flex:1 1 100%;margin:0}

/* monsters, log */
.monsters,.logsec,#settings{margin-top:44px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sech{font-size:clamp(1.6rem,4vw,2.2rem);color:var(--sun);text-shadow:3px 3px 0 var(--plum)}
.sec-sub{color:#dcd0ff;max-width:60ch;margin-top:6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.mcard{text-align:center}
.mcard canvas.mon{width:128px;height:128px;display:block;margin:0 auto 4px}
.mcard h3{font-family:var(--px);font-size:1.3rem}
.owed{font-family:var(--px);font-size:1.8rem;color:#b3123f;line-height:1.1;margin:4px 0 8px}.owed small{font-size:.8rem;color:var(--muted);font-family:var(--body);font-weight:700}
.mcard .bar{margin:6px 6px 8px}.mcard .row{justify-content:center}
.mcard.dead{opacity:.86}
.logrow{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-top:3px dotted rgba(42,23,69,.25)}.logrow:first-child{border-top:0}.logrow .d{color:var(--muted);font-weight:800}
.foot{margin-top:40px;color:#cbbcff;font-size:.9rem;max-width:70ch}

/* auth + wizard */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;position:relative;z-index:1}
.auth-card,.wizard{width:min(540px,100%)}.wizard{width:min(640px,100%)}
.auth-art{display:flex;justify-content:center;align-items:flex-end;margin-bottom:6px}.auth-art canvas{width:96px;height:96px}.auth-art canvas:nth-child(2){width:128px;height:128px}
.auth h1,.title{text-align:center;color:#ff5fa2;font-size:clamp(1.7rem,6vw,2.4rem);text-shadow:3px 3px 0 var(--plum)}
.wizard h1{font-size:clamp(1.5rem,5vw,2rem);color:#c2185b}
.pwshow{display:flex;gap:8px;align-items:center;color:var(--muted);margin:2px 0 8px}
.dots{display:flex;gap:10px;margin-bottom:12px}
.dot{width:16px;height:16px;background:#fff;box-shadow:0 0 0 3px var(--plum)}.dot.done{background:var(--mint)}.dot.on{background:var(--sun);transform:scale(1.25)}
.wrow{margin:14px 0;padding:6px 14px 10px;background:#fff8e6;box-shadow:0 0 0 3px var(--plum)}
.wrow-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--px)}
.sumlist{margin:12px 0;padding-left:1.2rem}.sumlist li{margin:6px 0}

/* dialogs + toast */
dialog{border:0;padding:0;background:var(--parch);color:var(--ink);width:min(500px,calc(100vw - 32px));box-shadow:0 -4px 0 0 var(--plum),0 4px 0 0 var(--plum),-4px 0 0 0 var(--plum),4px 0 0 0 var(--plum),0 12px 0 0 rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,10,50,.78)}
.dlg-in{padding:20px}.dlg-in h2{font-family:var(--px);color:#c2185b}.dlg-actions{display:flex;gap:6px;align-items:center;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:54px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--night);color:#fff;padding:10px 20px;max-width:min(92vw,560px);text-align:center;font-weight:700;transition:transform .2s,opacity .2s;z-index:120;box-shadow:0 0 0 4px var(--sun),0 8px 0 4px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0);opacity:1}

/* battle */
.battle{position:fixed;inset:0;z-index:100;background:rgba(15,7,38,.86);display:grid;place-items:center;padding:12px;overflow:auto}
.battle[hidden]{display:none}
.bcard{width:min(960px,100%);background:var(--parch);color:var(--ink);padding:16px;box-shadow:0 -4px 0 0 var(--plum),0 4px 0 0 var(--plum),-4px 0 0 0 var(--plum),4px 0 0 0 var(--plum),0 12px 0 0 rgba(0,0,0,.4)}
.bhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.bhead h2{font-family:var(--px);font-size:1.6rem;color:#c2185b}.bhead h2 span{font-size:1rem;color:var(--muted);font-family:var(--body)}
.bhp{display:flex;align-items:center;gap:10px;flex:1;min-width:230px}.bhp .bar{flex:1}
.bhp b{font-family:var(--px);font-size:1.5rem;min-width:6ch;text-align:right;color:#b3123f}
.bhp .bar>span{transition:none}
.bsav{margin:0 0 8px;color:var(--muted);font-weight:700}.bsav b{font-family:var(--px);font-size:1.3rem;color:var(--ink)}
.bstage{position:relative;background:#000;box-shadow:0 0 0 4px var(--plum)}
#bcv{display:block;width:100%;height:auto;aspect-ratio:384/216}
.bcap{position:absolute;left:0;right:0;top:8px;text-align:center;font-family:var(--px);font-size:clamp(1.6rem,5vw,2.8rem);color:#fff;text-shadow:3px 3px 0 var(--plum),-2px -2px 0 var(--plum),3px -2px 0 var(--plum),-2px 3px 0 var(--plum);pointer-events:none}
.bpanel{margin-top:16px}.bpanel h2{font-family:var(--px);font-size:1.9rem;color:#c2185b;margin-bottom:6px}

@media (max-width:900px){.arena{grid-template-columns:1fr}.arena .caves{order:-1}.nur-grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:640px){.two{grid-template-columns:1fr}.nur-grid{grid-template-columns:1fr 1fr}.top-in{padding:6px 10px}.hdr-user{display:none}.worth{text-align:left}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* money figures use the clean sans font: the pixel font's 2/8, 3/8 and 0/8 are too alike at small sizes */
.gem b,.worth b,.chip b,.hatch b,.owed,.bhp b,.bsav b,.logrow,.pm em{font-family:var(--num);font-weight:800;letter-spacing:0;font-variant-numeric:lining-nums tabular-nums}
.gem b{font-size:1.6rem}.worth b{font-size:2.5rem}.chip b{font-size:1.45rem}.hatch b{font-size:1.15rem}.owed{font-size:1.75rem}.owed small{font-weight:700}.bhp b{font-size:1.5rem}

<script>

/* paint a shape: dark outline hugging it (4-neighbour), then fill with fn(x,y) */
function paint(pb,mask,fn,outline){
  var w=mask.w,h=mask.h,x,y;

}
/* banded light-from-top-left shading with checker dither at the band edges */
function shader(cx,cy,rx,ry,r){

var WOOD=ramp('#9a6a3c'),STEEL=ramp('#cfd8e6'),BOOT=ramp('#7a4a2a');

/* pose: dy body lift, lg/rg foot lift, ang weapon angle (deg, 0=up, +=forward), lean px forward, shDy shield bob, sq squash(1=normal), blink */
function drawMush(pb,tier,skin,pose){
  var g=G[tier],sp=MSK[tier][skin],w=pb.w,h=pb.h,cx=32+(pose.lean||0),dy=pose.dy||0,sq=pose.sq||1;
  var capR=ramp(sp.cap),stR=ramp(sp.stem),scR=ramp(sp.sc||'#8b5a34'),metal=ramp(sp.metal||'#cfd8e6'),armor=g.arm>0;
  var gy=61,stemH=Math.round(g.stemH*sq),legY=gy-g.leg,stemBot=legY,stemTop=stemBot-stemH+1+dy,capBase=stemTop,capTop=capBase-g.capH;
  var m,k;
  /* shadow (drawn first, semi-dark) */
  for(var sx=-g.capW/2*.8;sx<=g.capW/2*.8;sx++){var sh=Math.round(1+(1-Math.abs(sx)/(g.capW/2*.8))*1.2);for(k=0;k<sh;k++)pb.set(32+Math.round(sx),gy+1-k+ (k?0:0),pk(20,10,40,90))}
  /* boots / legs */
  var lf=pose.lg||0,rf=pose.rg||0,bootC=armor?metal:BOOT,lx=cx-Math.round(g.stemW*.28)-1,rx=cx+Math.round(g.stemW*.28);
  [[lx,lf],[rx,rf]].forEach(function(p){m=new Mask(w,h);mRect(m,p[0]-1,gy-g.leg+1-p[1],3,g.leg,1);mRect(m,p[0]-1,gy-1-p[1],4,2);paint(pb,m,function(x,y){return y>=gy-1-p[1]?bootC.d:bootC.b},INKC)});
  /* stem (slightly wider at the bottom) */
  var sw=g.stemW;
  m=new Mask(w,h);mPoly(m,[[cx-sw/2+1,stemTop],[cx+sw/2-1,stemTop],[cx+sw/2+.5,stemBot],[cx-sw/2-.5,stemBot]]);mEll(m,cx,stemBot-1,sw/2+.4,2.4);
  paint(pb,m,shader(cx,(stemTop+stemBot)/2,sw/2,stemH/2,stR),INKC);
  /* chest plate (armoured tiers) */
  if(armor){
    m=new Mask(w,h);var py=stemTop+Math.round(stemH*.66);mPoly(m,[[cx-sw/2+1,py],[cx+sw/2-1,py],[cx+sw/2+.5,stemBot],[cx-sw/2-.5,stemBot]]);
    paint(pb,m,shader(cx,(py+stemBot)/2,sw/2,(stemBot-py)/2,metal),INKC);
    pb.rect(cx-sw/2,stemBot-3,sw+1,1,scR.b);   /* belt */
    pb.set(cx,py+2,metal.l2);pb.set(cx-1,py+2,metal.l2);if(tier==='x'){pb.set(cx-4,py+3,metal.d);pb.set(cx+4,py+3,metal.d);pb.rect(cx-1,py+1,3,3,scR.b);pb.set(cx,py+2,WHITE)}
  }
  /* shield arm + shield (left) */
  var shx=cx-Math.round(sw/2)-Math.round(g.sW/2)+2,shy=stemTop+Math.round(stemH*.62)+(pose.shDy||0)+(pose.shUp?-2:0);
  var armY=stemTop+Math.round(stemH*.55);
  m=new Mask(w,h);mLine(m,cx-Math.round(sw/2),armY,shx+1,shy,tier==='s'?1:2);paint(pb,m,stR.d,INKC);
  /* cap (dome + rim) */
  m=new Mask(w,h);mEll(m,cx,capBase,g.capW/2,g.capH,capBase);
  var domeMask=m;paint(pb,m,shader(cx,capBase-g.capH*.45,g.capW/2,g.capH*.7,capR),INKC);
  var rim=new Mask(w,h);mRect(rim,cx-Math.round(g.capW/2)+1,capBase+1,g.capW-2,2);mEll(rim,cx-g.capW/2+2,capBase+2,2,1.4);mEll(rim,cx+g.capW/2-2,capBase+2,2,1.4);
  paint(pb,rim,function(x,y){return y===capBase+1?capR.d:capR.d2},INKC);
  capPattern(pb,sp,g,cx,capBase,domeMask,capR,tier);
  /* armour on the cap: rim band; big ones get a full helmet crest */
  if(armor)helm(pb,sp,g,cx,capBase,capTop,domeMask,metal,tier);
  /* face on the stem, then the shield in front of the left arm */
  face(pb,g,cx,stemTop,tier,pose);
  drawShield(pb,sp.shield,shx,shy,g,scR,metal,armor,sp);
  /* weapon arm + weapon (right) */
  var hx=cx+Math.round(sw/2)+1+(pose.wdx||0),hy=stemTop+Math.round(stemH*.58)+(pose.wdy||0);

  /* pauldrons */
  if(armor){[cx-Math.round(sw/2)-1,cx+Math.round(sw/2)+1].forEach(function(px){m=new Mask(w,h);mEll(m,px,stemTop+2,g.arm+2,g.arm+1.4);paint(pb,m,shader(px,stemTop+2,g.arm+2,g.arm+1.4,metal),INKC)})}
  return pb;
}
function face(pb,g,cx,stemTop,tier,pose){
  var ey=stemTop+(tier==='s'?4:(tier==='m'?5:(tier==='l'?6:7))),sp=tier==='s'?2:(tier==='m'?3:(tier==='l'?4:5));
  if(pose.blink){pb.rect(cx-sp,ey,2,1,INKC);pb.rect(cx+sp-1,ey,2,1,INKC)}
  else if(pose.hurt){pb.set(cx-sp,ey,INKC);pb.set(cx-sp+1,ey+1,INKC);pb.set(cx-sp+1,ey-1,INKC);pb.set(cx+sp,ey,INKC);pb.set(cx+sp-1,ey+1,INKC);pb.set(cx+sp-1,ey-1,INKC)}
  else{
    var big=tier==='l'||tier==='x';
    pb.rect(cx-sp,ey,big?2:1,big?3:2,INKC);pb.rect(cx+sp-(big?1:0),ey,big?2:1,big?3:2,INKC);
    if(big){pb.set(cx-sp,ey,WHITE);pb.set(cx+sp-1,ey,WHITE)}else{pb.set(cx-sp,ey,mixC(INKC,WHITE,.4));pb.set(cx+sp,ey,mixC(INKC,WHITE,.4))}
  }
  var my=ey+(tier==='s'?3:(tier==='m'?4:(tier==='l'?4:5)));
  if(pose.mouth==='open'){pb.rect(cx-1,my,3,2,INKC);pb.set(cx,my+1,C('#e0506a'))}
  else{pb.set(cx-1,my,INKC);pb.set(cx,my+1,INKC);pb.set(cx+1,my,INKC);if(tier==='l'||tier==='x'){pb.set(cx-2,my-1,INKC);pb.set(cx+2,my-1,INKC)}}
  if(tier!=='s'){var ch=C('#ff8fa8');pb.set(cx-sp-1,ey+2,mixC(ch,WHITE,.1));pb.set(cx+sp+1,ey+2,mixC(ch,WHITE,.1))}
}
function capPattern(pb,sp,g,cx,capBase,dome,capR,tier){
  var w=pb.w,h=pb.h,R=rnd32(sp.cap.length*977+sp.n.length*31),spot=ramp(sp.spot),rad=tier==='s'?1.1:(tier==='m'?1.7:(tier==='l'?2.3:3)),i;
  var spotAt=function(x,y,r){var m=new Mask(w,h);mEll(m,x,y,r,r*.85);m=mAnd(m,dome);paint(pb,m,function(px,py){return (px+.5<x&&py+.5<y)?WHITE:spot.b},null)};
  var W=g.capW,H=g.capH;
  if(sp.pat==='spots'){var pts=[[-.55,-.35],[-.05,-.7],[.45,-.42],[-.2,-.22],[.1,-.28],[.62,-.12],[-.68,-.1]],n=tier==='s'?3:(tier==='m'?5:(tier==='l'?6:7));
    for(i=0;i<n;i++)spotAt(cx+pts[i][0]*W/2,capBase+pts[i][1]*H,rad*(i%3===1?1.15:(i%3===2?.8:1)))}
  else if(sp.pat==='speck'){var n2=tier==='s'?8:(tier==='m'?14:(tier==='l'?22:32));for(i=0;i<n2;i++){var a=R()*Math.PI,r=R()*.85,x=cx+Math.cos(a)*r*W/2*.95,y=capBase-Math.sin(a)*r*H*.9-1;if(dome.has(x,y)){pb.set(x,y,spot.b)}}}
  else if(sp.pat==='warts'){var n3=tier==='s'?7:12;for(i=0;i<n3;i++){var a3=R()*Math.PI,r3=R()*.8,x3=cx+Math.cos(a3)*r3*W/2*.9,y3=capBase-Math.sin(a3)*r3*H*.85-1;if(dome.has(x3,y3)){pb.set(x3,y3,spot.b);if(tier!=='s')pb.set(x3+1,y3,spot.d)}}}
  else if(sp.pat==='stripes'){for(i=-2;i<=2;i++){var m1=new Mask(w,h);mLine(m1,cx+i*1.5,capBase-H+2,cx+i*W*.2,capBase-1,1);paint(pb,mAnd(m1,dome),capR.d,null)}}
  else if(sp.pat==='rings'){for(var q=1;q<=(tier==='x'?3:2);q++){for(var t=0;t<=Math.PI;t+=.12){var px=cx+Math.cos(t)*W/2*(.28*q+.05),py=capBase-Math.sin(t)*H*(.3*q+.05);if(dome.has(px,py))pb.set(px,py,q%2?spot.b:capR.d)}}}
  else if(sp.pat==='stars'){var stars=[[-.5,-.35],[.1,-.65],[.5,-.3],[-.1,-.2]];stars.forEach(function(s,ix){var x=Math.round(cx+s[0]*W/2),y=Math.round(capBase+s[1]*H),c=C('#ffe066');pb.set(x,y,c);if(tier!=='s'&&ix!==3){pb.set(x-1,y,c);pb.set(x+1,y,c);pb.set(x,y-1,c);pb.set(x,y+1,c)}})}
  else if(sp.pat==='moss'){[[-.45,-.5,.3],[.25,-.72,.26],[.55,-.3,.22]].forEach(function(s,ix){var m2=new Mask(w,h);mEll(m2,cx+s[0]*W/2,capBase+s[1]*H,s[2]*W/2,s[2]*H*.7);paint(pb,mAnd(m2,dome),function(px,py){return (px+py)%3===0?spot.d:spot.b},null)});pb.set(cx-3,capBase-H+3,C('#f4f1e8'))}
}
/* metal band on the cap + a crest for the $1000 knights */
function helm(pb,sp,g,cx,capBase,capTop,dome,metal,tier){
  var w=pb.w,h=pb.h,m=new Mask(w,h),bandY=capBase-Math.round(g.capH*.32);
  mRect(m,cx-Math.round(g.capW/2)+1,bandY,g.capW-2,tier==='x'?3:2);m=mAnd(m,dome);paint(pb,m,function(x,y){return y===bandY?metal.l:metal.b},INKC);
  for(var rx=cx-Math.round(g.capW/2)+4;rx<cx+g.capW/2-3;rx+=5)pb.set(rx,bandY+(tier==='x'?1:0),metal.d2);
  if(tier==='x'){
    m=new Mask(w,h);mRect(m,cx-1,capTop+1,3,bandY-capTop);paint(pb,mAnd(m,dome),function(x,y){return x===cx-1?metal.l:metal.b},null);   /* central ridge */
    var cc=ramp(sp.cc||'#e4502c'),cr=sp.crest;
    if(cr==='plume'){m=new Mask(w,h);mPoly(m,[[cx-1,capTop+1],[cx+1,capTop+1],[cx+6,capTop-8],[cx+10,capTop-5],[cx+5,capTop-1],[cx+3,capTop+2]]);paint(pb,m,function(x,y){return y<capTop-4?cc.l:cc.b},INKC)}
    else if(cr==='horns'){[-1,1].forEach(function(sd){m=new Mask(w,h);mPoly(m,[[cx+sd*(g.capW/2-6),capTop+5],[cx+sd*(g.capW/2-2),capTop+7],[cx+sd*(g.capW/2+3),capTop-3],[cx+sd*(g.capW/2-1),capTop-2]]);paint(pb,m,cc.b,INKC)})}
    else if(cr==='spikes'){for(var s=-2;s<=2;s+=2){m=new Mask(w,h);mPoly(m,[[cx+s*4-2,capTop+3+Math.abs(s)],[cx+s*4+2,capTop+3+Math.abs(s)],[cx+s*4,capTop-3+Math.abs(s)*2]]);paint(pb,m,metal.l,INKC)}}
    else if(cr==='laurel'){for(var t=-1;t<=1;t+=2)for(var k=0;k<4;k++){pb.set(cx+t*(4+k*3),capTop+3+k*2,cc.b);pb.set(cx+t*(4+k*3),capTop+4+k*2,cc.d)}}
  }

function drawShield(pb,type,x,y,g,scR,metal,armor,sp){
  var w=pb.w,h=pb.h,m=new Mask(w,h),sw=g.sW,sh=g.sH,rimC=armor?metal:WOOD;
  if(type==='round'||type==='buckler'){var rr=type==='buckler'?sw*.42:sw*.5,ry=type==='buckler'?rr:sh*.42;mEll(m,x,y,rr,ry)}
  else if(type==='kite'){mPoly(m,[[x-sw/2,y-sh/2],[x+sw/2,y-sh/2],[x+sw/2,y+sh*.1],[x,y+sh/2+1],[x-sw/2,y+sh*.1]])}
  else if(type==='heater'){mRect(m,x-sw/2,y-sh/2,sw,Math.round(sh*.5));mEll(m,x,y,sw/2,sh*.5,null);var tmp=new Mask(w,h);mRect(tmp,x-sw/2-1,y-sh/2,sw+2,sh);m=mAnd(m,tmp);mRect(m,x-sw/2,y-sh/2,sw,Math.round(sh*.5))}
  else{mRect(m,x-sw/2,y-sh/2,sw,sh);mEll(m,x,y+sh/2-1,sw/2,2.4)}
  var face=ramp(sp.sc||'#8b5a34');
  paint(pb,m,shader(x,y,sw/2,sh/2,face),INKC);
  /* rim highlight + emblem */
  for(var yy=0;yy<h;yy++)for(var xx=0;xx<w;xx++)if(m.has(xx,yy)&&(!m.has(xx-1,yy)||!m.has(xx,yy-1)))pb.set(xx,yy,rimC.l);
  var em=ramp('#ffe9a8');
  if(g.sW>=10){pb.rect(x-1,y-2,2,5,em.b);pb.rect(x-2,y-1,4,2,em.b)}else{pb.set(x,y,em.b);pb.set(x,y-1,em.b)}
  if(g.sW>=13)pb.set(x,y,metal.l2);
}
function drawWeapon(pb,type,hx,hy,ang,len,tier,scR,metal,sp){
  var w=pb.w,h=pb.h,a=ang*Math.PI/180,dx=Math.sin(a),dy=-Math.cos(a),th=tier==='s'?1:(tier==='m'?2:(tier==='l'?2:3)),m,ex=hx+dx*len,ey=hy+dy*len;
  var blade=type==='sword'?STEEL:(sp.metal?metal:STEEL);
  if(type==='sword'){
    var hl=Math.round(len*.28),gx=hx+dx*hl,gy2=hy+dy*hl;
    m=new Mask(w,h);mLine(m,hx-dx*2,hy-dy*2,gx,gy2,th);paint(pb,m,WOOD.b,INKC);                           /* grip */
    m=new Mask(w,h);mLine(m,gx-dy*(th+2),gy2+dx*(th+2),gx+dy*(th+2),gy2-dx*(th+2),1);paint(pb,m,C('#e0a422'),INKC);   /* guard */
    m=new Mask(w,h);mLine(m,gx+dx,gy2+dy,ex,ey,th);paint(pb,m,function(x,y){return blade.b},INKC);                   /* blade */
    m=new Mask(w,h);mLine(m,gx+dx*2-dy*(th>2?1:0),gy2+dy*2+dx*(th>2?1:0),ex-dx,ey-dy,1);paint(pb,m,blade.l2,null);
  }else if(type==='axe'){
    m=new Mask(w,h);mLine(m,hx-dx*2,hy-dy*2,ex,ey,th>2?2:1+(th>1?1:0));paint(pb,m,WOOD.b,INKC);
    var hd=Math.round(len*.28),px=ex-dx*hd*.35,py=ey-dy*hd*.35,nx=-dy,ny=dx;
    m=new Mask(w,h);mPoly(m,[[px+nx*1,py+ny*1],[px+nx*(hd)+dx*hd*.5,py+ny*(hd)+dy*hd*.5],[px+nx*(hd)-dx*hd*.7,py+ny*(hd)-dy*hd*.7],[px-dx*hd*.8,py-dy*hd*.8]]);
    paint(pb,m,function(x,y){return ((x+y)%5===0)?blade.l2:blade.b},INKC);
  }else if(type==='spear'){
    m=new Mask(w,h);mLine(m,hx-dx*3,hy-dy*3,ex,ey,th>2?2:1);paint(pb,m,WOOD.b,INKC);
    var tl=Math.round(len*.24),bx=ex,by=ey;m=new Mask(w,h);mPoly(m,[[bx-dy*(th+1),by+dx*(th+1)],[bx+dy*(th+1),by-dx*(th+1)],[bx+dx*tl,by+dy*tl]]);paint(pb,m,blade.b,INKC);
  }else{
    var sl=Math.round(len*.72),sx=hx+dx*sl,sy=hy+dy*sl,hr=tier==='s'?2.2:(tier==='m'?3:(tier==='l'?4:5.5));
    m=new Mask(w,h);mLine(m,hx-dx*2,hy-dy*2,sx,sy,th>2?2:1);paint(pb,m,WOOD.b,INKC);
    m=new Mask(w,h);mEll(m,sx+dx*hr*.6,sy+dy*hr*.6,hr,hr);paint(pb,m,shader(sx+dx*hr*.6,sy+dy*hr*.6,hr,hr,blade),INKC);
    for(var k=0;k<6;k++){var aa=k*Math.PI/3,qx=sx+dx*hr*.6+Math.cos(aa)*(hr+1),qy=sy+dy*hr*.6+Math.sin(aa)*(hr+1);if(tier!=='s')pb.set(qx,qy,blade.l)}
  }
}

/* ---- the animation set (21 frames): idle 0-3, walk 4-7, attack 8-11, die 12-16, cheer 17-20 ---- */
var ANIM={idle:[0,4,4],walk:[4,4,9],atk:[8,4,10],die:[12,5,8],cheer:[17,4,8]};
var NFR=21;
function poseFor(name,i,tier){
  var s=tier==='s'?1:(tier==='m'?1.4:2),P;
  if(name==='idle'){P=[{dy:0,ang:14},{dy:-1,ang:16,shDy:0},{dy:-1,ang:14,blink:1},{dy:0,ang:12,shDy:1}][i]}
  else if(name==='walk'){P=[{dy:0,lg:0,rg:1,ang:18},{dy:-1,lg:0,rg:0,ang:22},{dy:0,lg:1,rg:0,ang:18},{dy:-1,lg:0,rg:0,ang:10}][i]}
  else if(name==='atk'){P=[{dy:0,lean:-1,ang:-35,wdx:-1,wdy:-1,shUp:1},{dy:1,lean:Math.round(2*s),ang:75,wdx:2,wdy:1,mouth:'open'},{dy:1,lean:Math.round(3*s),ang:130,wdx:3,wdy:2,mouth:'open'},{dy:0,lean:1,ang:60,wdx:1}][i]}
  else if(name==='cheer'){P=[{dy:0,ang:20,mouth:'open'},{dy:-Math.round(3*s),ang:-8,wdy:-3,mouth:'open',shUp:1},{dy:-Math.round(5*s),ang:-16,wdy:-4,mouth:'open',shUp:1},{dy:-Math.round(2*s),ang:0,wdy:-2,mouth:'open'}][i]}
  else{P={dy:0,ang:14,hurt:1}}
  return P;
}
function mushFrame(tier,skin,name,i){
  var pb=new PB(64,64),P=poseFor(name,i,tier);
  if(name!=='die'){drawMush(pb,tier,skin,P);return pb}
  /* death: hit flash -> topple -> lie flat -> fade */
  var base=new PB(64,64);drawMush(base,tier,skin,P);
  var deg=[0,-22,-58,-88,-90][i],out;
  out=rotBuf(base,deg,32,61,i>=3?-2:0,i>=3?1:0);
  if(i===0)flashBuf(out,.75);if(i===1)flashBuf(out,.35);
  if(i===3)flashBuf(out,.12,BLACK);if(i===4)fadeBuf(flashBuf(out,.25,BLACK),.55);
  return out;
}
/* one horizontal sheet of NFR frames */
function mushSheet(tier,skin){var sheet=new PB(64*NFR,64),f=0;['idle','walk','atk','die','cheer'].forEach(function(n){for(var i=0;i<ANIM[n][1];i++){sheet.blit(mushFrame(tier,skin,n,i),f*64,0);f++}});return sheet}

/* ---------- secure vault: PBKDF2 -> AES-256-GCM, all on this device ---------- */
var enc=window.TextEncoder?new TextEncoder():null;

function eraseVault(){memVault=null;memMeta=null;try{localStorage.removeItem(VAULT_KEY);localStorage.removeItem(META_KEY)}catch(e){}}
function readMeta(){try{var r=localStorage.getItem(META_KEY);return r?JSON.parse(r):(memMeta||{fails:0,until:0})}catch(e){return memMeta||{fails:0,until:0}}}

function toB64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}

async function deriveKey(pw,salt,iter){
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,userKey,text,salt,iter){
  var iv=crypto.getRandomValues(new Uint8Array(12));

  return {v:1,kdf:'PBKDF2-SHA256',iter:iter,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)};

  return new TextDecoder().decode(pt);
}
var session=null,chain=Promise.resolve(),idleT=0,lastTouch=0,busy=false;

function wizCaves(w){var out=[];w.caves.forEach(function(c,i){var b=Math.round(parseMoney(c.bal));if(String(c.name).trim())out.push(newCave(String(c.name).trim(),c.kind,i,isFinite(b)&&b>0?b:0))});return out}
function wizDebts(w){var out=[];w.debts.forEach(function(d,i){var wr=Math.round(parseMoney(d.worth));if(!isFinite(wr)||wr<=0||!String(d.name).trim())return;var lf=String(d.left).trim()===''?wr:Math.round(parseMoney(d.left));if(!isFinite(lf))lf=wr;out.push({id:uid(),name:String(d.name).trim().slice(0,30),worth:Math.max(wr,lf),owed:clamp(lf,0,Math.max(wr,lf)),design:i&3})});return out}

function wizNext(){
  var w=ui.wiz,p=session.profile;w.err='';

    var any=false,i;
    for(i=0;i<w.caves.length;i++){var c=w.caves[i],b=String(c.bal).trim();
      if(!String(c.name).trim()&&!b)continue;
      if(!String(c.name).trim()){w.err='Cave '+(i+1)+': give it a name.';return wizRedraw()}
      if(b!==''&&(!isFinite(parseMoney(b))||parseMoney(b)<0)){w.err='Cave '+(i+1)+': enter the amount as a number (0 or more).';return wizRedraw()}
      if(canonN(Math.round(parseMoney(b)||0))>MAXM){w.err='Cave '+(i+1)+': that\'s more than '+MAXM+' mushrooms! Split it across two caves.';return wizRedraw()}
      any=true}
    if(!any){w.err='Add at least one cave to get started.';return wizRedraw()}
  }else if(w.step===1){
    for(var j=0;j<w.debts.length;j++){var d=w.debts[j],has=String(d.name).trim()||String(d.worth).trim()||String(d.left).trim();if(!has)continue;
      if(!String(d.name).trim()){w.err='Monster '+(j+1)+': give it a name.';return wizRedraw()}
      var wr=parseMoney(d.worth);if(!isFinite(wr)||wr<=0){w.err='Monster '+(j+1)+': enter how big it was as a number above 0.';return wizRedraw()}
      if(String(d.left).trim()!==''&&(!isFinite(parseMoney(d.left))||parseMoney(d.left)<0)){w.err='Monster '+(j+1)+': "how much is left" should be a number (0 or more).';return wizRedraw()}}
  }else{
    p.caves=wizCaves(w);p.debts=wizDebts(w);p.onboarded=true;ui.wiz=null;ui.caveId=p.caves[0].id;ui.sel=new Set();save();render();window.scrollTo(0,0);toast('Welcome, brave spore-wrangler!');return;
  }

}

  return '<div class="sec-head"><h2 class="px sech">Settings</h2></div><div class="two"><div class="panel"><h3>Security</h3><p class="muted" style="margin:6px 0 12px">Your data is encrypted on this device. It locks itself after 5 minutes of inactivity.</p><div class="row"><button class="btn small primary" data-act="lock">Lock now</button><button class="btn small" data-act="bk-show">Encrypted backup</button></div>'
    +'<div id="bkBox" hidden><label class="fld" for="bkText"><span>Backup (safe to store, it\'s encrypted)</span><textarea id="bkText" spellcheck="false"></textarea></label><div class="row"><button class="btn small" data-act="bk-copy">Copy</button><button class="btn small danger" data-act="bk-restore">Restore from this text</button></div><p class="err" id="bkErr" role="alert"></p></div></div>'
    +'<div class="panel"><h3>Erase everything</h3><p class="muted" style="margin:6px 0 12px">Deletes your vault from this device. This can\'t be undone unless you saved a backup.</p><button class="btn small danger" data-act="erase">Erase all my data</button></div></div>';
}
/* keep keyboard focus on "the same" control when a region is redrawn */
function focusKey(){var a=document.activeElement;if(!a||a===document.body)return null;if(a.id)return '#'+a.id;var s=a.dataset;return s&&s.act?'[data-act="'+s.act+'"]'+(s.v?'[data-v="'+s.v+'"]':'')+(s.id?'[data-id="'+s.id+'"]':''):null}
function restoreFocus(k){if(!k)return;var e=document.querySelector(k);if(e&&!e.disabled&&e.focus)e.focus()}
function keepFocus(fn){var k=focusKey();fn();restoreFocus(k)}
/* redraw one region without rebuilding the cave canvas (so the mushrooms keep wandering) */
function refresh(animate){keepFocus(function(){refreshNow(animate)})}
function refreshNow(animate){
  var p=session.profile,c=curCave(p);
  $('#strip').innerHTML=stripHTML(p);$('#tabs').innerHTML=tabsHTML(p);$('#nursery').innerHTML=nurseryHTML(p);$('#info').innerHTML=infoHTML(p);$('#monsters').innerHTML=monstersHTML(p);$('#log').innerHTML=logHTML(p);$('#settings').innerHTML=settingsHTML(p);
  var cv=$('#cave');if(cv&&c)cv.setAttribute('aria-label',c.name+': '+money(caveTotal(c))+' as '+c.mush.length+' wandering mushrooms. Click a mushroom to pick it for battle.');
  if(c)CaveView.sync(c,animate);
  bindSprites($('#app'));
}
function mountCave(){var p=session.profile,c=curCave(p);if(c)CaveView.mount($('#cave'),c,ui.sel,pickMush);}
function redrawInfo(){keepFocus(function(){$('#info').innerHTML=infoHTML(session.profile);bindSprites($('#app'))});CaveView.draw()}
function pickMush(id){if(ui.sel.has(id))ui.sel.delete(id);else ui.sel.add(id);redrawInfo()}
function switchCave(id){var p=session.profile;if(!findCave(p,id))return;ui.caveId=id;ui.sel=new Set();mountCave();refresh(false)}

/* ---------- actions ---------- */
function persist(){save()}
function hatch(v,qty){
  var p=session.profile,c=curCave(p);if(!c)return;
  if(c.mush.length+qty>MAXM){toast('That cave is full of mushrooms ('+MAXM+' max)! Use "Tidy up" to merge little ones into bigger ones.');return}
  var t=TIER_OF[v];for(var i=0;i<qty;i++)c.mush.push(newMush(v,i===0?ui.next[t]:null));
  ui.next[t]=(ui.next[t]+1+Math.floor(Math.random()*3))&3;
  persist();refresh(true);toast('Hatched '+qty+' × '+money(v)+' mushroom'+(qty>1?'s':'')+'! '+c.name+' now holds '+money(caveTotal(c))+'.');
}
function hatchAmount(){
  var p=session.profile,c=curCave(p);if(!c)return;var raw=$('#amtIn').value,a=Math.round(parseMoney(raw));
  if(!isFinite(a)||a<=0){toast('Type an amount above $0 to hatch.');return}
  if(c.mush.length+canonN(a)>MAXM){toast('That would be over '+MAXM+' mushrooms in one cave. Try a smaller amount, or tidy up first.');return}
  canon(a).forEach(function(m){c.mush.push(m)});persist();refresh(true);toast('Hatched '+money(a)+' of mushrooms into '+c.name+'!');
}
function caveModal(c){
  var p=session.profile,editing=!!c;
  openModal({title:editing?'Edit cave':'Dig a new cave',submit:editing?'Save cave':'Dig it!',
    fields:[{key:'name',label:'Cave name',type:'text',value:editing?c.name:'',placeholder:'e.g. Emergency Stash',maxlength:30},
      {key:'kind',label:'Kind of account',type:'select',value:editing?c.kind:'savings',options:[{value:'savings',label:'Savings'},{value:'spending',label:'Spending (checking)'}]},
      {key:'bal',label:editing?'Set exact balance':'Starting balance',type:'number',value:editing?String(caveTotal(c)):'',placeholder:'0',hint:editing?'Changing this reshapes the mushrooms to match. To move money around, hatch or spend mushrooms instead.':'Whole dollars only.'}],
    secondary:editing&&p.caves.length>1?{label:'Delete cave',run:function(){confirmModal('Delete '+c.name+'?','The cave and its '+c.mush.length+' mushrooms will be gone.','Delete cave',function(){p.caves=p.caves.filter(function(x){return x.id!==c.id});ui.caveId=p.caves[0].id;ui.sel=new Set();persist();mountCave();refresh(false);toast('Cave deleted.')})}}:null,
    onSubmit:function(v){
      var name=String(v.name||'').trim();if(!name)return 'Give your cave a name.';
      var raw=v.bal_raw,b=raw===''?0:Math.round(v.bal);if(!isFinite(b)||b<0)return 'Enter the amount as a number (0 or more).';
      if(canonN(b)>MAXM)return 'That\'s more than '+MAXM+' mushrooms! Split it across two caves.';
      if(editing){c.name=name.slice(0,30);c.kind=v.kind==='spending'?'spending':'savings';if(b!==caveTotal(c))setBalance(c,b);persist();return function(){refresh(true);toast('Cave saved.')}}
      var nc=newCave(name,v.kind,p.caves.length,b);p.caves.push(nc);ui.caveId=nc.id;ui.sel=new Set();persist();return function(){mountCave();refresh(false);toast('A new cave opens: '+nc.name+'!')};
    }});
}
function debtModal(d){
  var p=session.profile,editing=!!d;
  openModal({title:editing?'Edit monster':'A wild monster appears!',submit:editing?'Save monster':'Add monster',
    fields:[{key:'name',label:'Its name',type:'text',value:editing?d.name:'',placeholder:'e.g. Rewards Visa',maxlength:30},
      {key:'worth',label:'How big was it?',type:'number',value:editing?String(d.worth):'',placeholder:'0'},
      {key:'left',label:'How much is left?',type:'number',value:editing?String(d.owed):'',placeholder:'same as its size',hint:'Leave blank if you haven\'t started fighting it.'}],
    secondary:editing?{label:'Delete monster',run:function(){confirmModal('Delete '+d.name+'?','This removes the monster from your list.','Delete monster',function(){p.debts=p.debts.filter(function(x){return x.id!==d.id});persist();refresh(false);toast('Monster removed.')})}}:null,
    onSubmit:function(v){
      var name=String(v.name||'').trim();if(!name)return 'Give this monster a name.';
      var wr=Math.round(v.worth);if(!isFinite(wr)||wr<=0)return 'Enter how big it was as a number above 0.';
      var lf=v.left_raw===''?wr:Math.round(v.left);if(!isFinite(lf)||lf<0)return '"How much is left" should be a number (0 or more).';
      wr=Math.max(wr,lf);
      if(editing){d.name=name.slice(0,30);d.worth=wr;d.owed=lf}else p.debts.push({id:uid(),name:name.slice(0,30),worth:wr,owed:lf,design:p.debts.length&3});
      persist();return function(){refresh(false);toast(editing?'Monster updated.':'A new monster lurks: '+name+'!')};
    }});
}
function moveModal(){
  var p=session.profile,c=curCave(p),ids=c.mush.filter(function(m){return ui.sel.has(m.id)});if(!ids.length)return;
  var others=p.caves.filter(function(k){return k.id!==c.id});
  openModal({title:'Move mushrooms',text:'Send '+ids.length+' picked mushroom'+(ids.length>1?'s':'')+' worth '+money(sum(ids,function(m){return m.v}))+' to another cave.',submit:'Move them',fields:[{key:'to',label:'Move to',type:'select',value:others[0].id,options:others.map(function(k){return {value:k.id,label:k.name+' ('+money(caveTotal(k))+')'}})}],
    onSubmit:function(v){var to=findCave(p,v.to);if(!to)return 'Pick a cave.';if(to.mush.length+ids.length>MAXM)return 'That cave would have more than '+MAXM+' mushrooms.';
      c.mush=c.mush.filter(function(m){return !ui.sel.has(m.id)});ids.forEach(function(m){to.mush.push(m)});var amt=sum(ids,function(m){return m.v});ui.sel=new Set();persist();
      return function(){CaveView.mount($('#cave'),c,ui.sel,pickMush);refresh(true);toast('Moved '+money(amt)+' to '+to.name+'.')}}});
}
function spendModal(){
  var p=session.profile,c=curCave(p),ids=c.mush.filter(function(m){return ui.sel.has(m.id)});if(!ids.length)return;var amt=sum(ids,function(m){return m.v});
  confirmModal('Spend '+money(amt)+'?',ids.length+' picked mushroom'+(ids.length>1?'s':'')+' will leave '+c.name+' for good, and the cave shrinks by '+money(amt)+'. Use this when you really spent the money.','Spend it',function(){
    c.mush=c.mush.filter(function(m){return !ui.sel.has(m.id)});ui.sel=new Set();
    p.log.unshift({id:uid(),date:today(),text:'Spent '+money(amt)+' from '+c.name+'.'});p.log=p.log.slice(0,40);persist();refresh(true);toast('Spent '+money(amt)+'. '+c.name+' now holds '+money(caveTotal(c))+'.');
  });
}
function splitPicked(){
  var p=session.profile,c=curCave(p),big=c.mush.filter(function(m){return ui.sel.has(m.id)&&m.v>1});
  if(!big.length){toast('Pick a mushroom worth $10 or more to break apart.');return}
  if(c.mush.length+big.length*9>MAXM){toast('Breaking those apart would make more than '+MAXM+' mushrooms in one cave.');return}
  var ids={};big.forEach(function(m){ids[m.id]=1});c.mush=c.mush.filter(function(m){return !ids[m.id]});
  big.forEach(function(m){for(var i=0;i<10;i++)c.mush.push(newMush(m.v/10))});
  ui.sel=new Set();persist();refresh(true);toast('Broke '+big.length+(big.length>1?' mushrooms':' mushroom')+' into smaller ones. Same money, more pieces!');
}
function deploy(debtId){
  var p=session.profile,c=curCave(p),d=findDebt(p,debtId||ui.target);
  if(!c||!d){toast('Pick a monster to fight.');return}
  if(d.owed<=0){toast(d.name+' is already slain!');return}
  var caveBefore=caveTotal(c),picked=c.mush.filter(function(m){return ui.sel.has(m.id)}),exRaw=String(ui.exact||'').trim(),ms=[];
  if(exRaw!==''){
    var A=Math.round(parseMoney(exRaw));
    if(!isFinite(A)||A<=0){toast('Type an amount above $0 to send.');return}
    var pool=picked.length?picked:c.mush,poolT=sum(pool,function(m){return m.v});
    if(A>poolT){toast('That\'s more than '+(picked.length?'the mushrooms you picked hold':'this cave holds')+' ('+money(poolT)+').');return}
    var taken=[],left=[],rem=A;
    pool.slice().sort(function(x,y){return y.v-x.v}).forEach(function(m){if(m.v<=rem){taken.push(m);rem-=m.v}else left.push(m)});
    var split=null;if(rem>0){left.sort(function(x,y){return x.v-y.v});split=left[0]}   /* smallest unused mushroom is bigger than what's left to send */
    var gone={};taken.forEach(function(m){gone[m.id]=1});if(split)gone[split.id]=1;
    c.mush=c.mush.filter(function(m){return !gone[m.id]});ms=taken.slice();
    if(split){canon(rem).forEach(function(m){ms.push(m)});canon(split.v-rem).forEach(function(m){c.mush.push(m)})}
  }else{
    if(!picked.length){toast('Pick some mushrooms first: click them in the cave, or type an exact amount!');return}
    ms=picked;c.mush=c.mush.filter(function(m){return !ui.sel.has(m.id)});
  }
  var sent=sum(ms,function(m){return m.v}),applied=Math.min(sent,d.owed),change=sent-applied,before=d.owed,army=ms.map(function(m){return {v:m.v,skin:m.skin}});
  d.owed-=applied;if(change>0)canon(change).forEach(function(m){c.mush.push(m)});
  var won=d.owed<=0,caveAfter=caveTotal(c),pct=Math.round((1-d.owed/d.worth)*100);
  p.log.unshift({id:uid(),date:today(),text:won?('Slew '+d.name+' with '+money(sent)+' from '+c.name+'!'):(money(applied)+' from '+c.name+' hit '+d.name+', now '+pct+'% beaten up ('+money(d.owed)+' left).')});p.log=p.log.slice(0,40);
  ui.sel=new Set();ui.exact='';persist();
  Battle.open({name:d.name,design:d.design,worth:d.worth,before:before,after:d.owed,sent:sent,applied:applied,change:change,won:won,cave:c.name,caveBefore:caveBefore,caveAfter:caveAfter,theme:c.theme,seedN:c.seedN,mush:army},function(){
    refresh(true);if(won)window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'});
    toast(won?('You slew '+d.name+'! '+c.name+' now holds '+money(caveAfter)+'.'):(d.name+' is '+pct+'% beaten up. '+c.name+' now holds '+money(caveAfter)+'.'));
  });
}
/* ---------- events ---------- */
function bumpIdle(){var n=Date.now();if(n-lastTouch>1000){lastTouch=n;resetIdle()}}
['pointerdown','keydown','touchstart','scroll'].forEach(function(ev){document.addEventListener(ev,bumpIdle,{passive:true})});
function wizList(){return ui.wiz.step===0?ui.wiz.caves:ui.wiz.debts}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.dataset.act,v=t.dataset.v,id=t.dataset.id,p=session&&session.profile;
  if(act==='a-create')createAccount();
  else if(act==='a-unlock')unlockVault();
  else if(act==='a-mode'){ui.authUser=($('#aUser')||{}).value||'';ui.authErr='';ui.authMode=v;render()}
  else if(act==='demo')startDemo();
  else if(act==='a-restore')restoreModal();
  else if(act==='a-erase'){confirmModal('Erase everything?','This permanently deletes the vault on this device. Nobody can recover it, including me.','Erase everything',function(){eraseVault();ui.authMode='create';ui.authErr='';render();toast('Vault erased. You can start fresh.')})}
  else if(act==='leave-demo'){wipeTransient();CaveView.unmount();Loop.stop();session=null;ui.authMode=readVault()?'unlock':'create';render();window.scrollTo(0,0)}
  else if(!session)return;
  else if(act==='w-next')wizNext();
  else if(act==='w-back'){ui.wiz.step=Math.max(0,ui.wiz.step-1);ui.wiz.err='';wizRedraw()}
  else if(act==='w-add'){wizList().push(ui.wiz.step===0?{name:'',kind:'savings',bal:''}:{name:'',worth:'',left:''});wizRedraw()}
  else if(act==='w-del'){wizList().splice(+t.dataset.i,1);wizRedraw()}
  else if(act==='lock')lock('Vault locked. Sweet dreams!');
  else if(act==='cave')switchCave(id);
  else if(act==='cave-step'){var i=p.caves.findIndex(function(c){return c.id===(curCave(p)||{}).id}),n=p.caves.length;switchCave(p.caves[(i+ +t.dataset.d+n)%n].id)}
  else if(act==='add-cave')caveModal(null);
  else if(act==='edit-cave')caveModal(curCave(p));
  else if(act==='qty'){ui.qty=+v;keepFocus(function(){$('#nursery').innerHTML=nurseryHTML(p);bindSprites($('#app'))})}
  else if(act==='hatch')hatch(+v,ui.qty);
  else if(act==='hatch-amt')hatchAmount();
  else if(act==='pick+'||act==='pick-'){var c=curCave(p),pool=c.mush.filter(function(m){return m.v===+v});
    if(act==='pick+'){var nx=pool.filter(function(m){return !ui.sel.has(m.id)})[0];if(nx)ui.sel.add(nx.id)}else{var pk=pool.filter(function(m){return ui.sel.has(m.id)}).pop();if(pk)ui.sel.delete(pk.id)}
    redrawInfo()}
  else if(act==='sel-all'){curCave(p).mush.forEach(function(m){ui.sel.add(m.id)});redrawInfo()}
  else if(act==='sel-none'){ui.sel=new Set();CaveView.mount($('#cave'),curCave(p),ui.sel,pickMush);redrawInfo()}
  else if(act==='split')splitPicked();
  else if(act==='tidy'){var c2=curCave(p);setBalance(c2,caveTotal(c2));ui.sel=new Set();persist();CaveView.mount($('#cave'),c2,ui.sel,pickMush);refresh(true);toast('All tidy! Little mushrooms merged into bigger ones.')}
  else if(act==='move')moveModal();
  else if(act==='spend')spendModal();
  else if(act==='deploy')deploy(ui.target);
  else if(act==='fight'){ui.target=id;deploy(id)}
  else if(act==='add-debt')debtModal(null);
  else if(act==='edit-debt'){var d=findDebt(p,id);if(d)debtModal(d)}
  else if(act==='bk-show'){$('#bkBox').hidden=false;$('#bkText').value=JSON.stringify(readVault()||{})}
  else if(act==='bk-copy'){var bt=$('#bkText');bt.value=JSON.stringify(readVault()||{});bt.select();var ok=function(){toast('Backup copied')},fb=function(){try{document.execCommand('copy');ok()}catch(er){toast('Select the text and copy it.')}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(bt.value).then(ok,fb);else fb()}
  else if(act==='bk-restore'){
    var err=$('#bkErr');err.textContent='';var vv=parseBackup($('#bkText').value);
    if(!vv){err.textContent=BAD_BACKUP;return}
    confirmModal('Restore this backup?','This replaces the vault on this device. You\'ll log in with the username and password you used when you made the backup.','Restore',function(){
      clearTimeout(idleT);writeVault(vv);writeMeta({fails:0,until:0});ui.authMode='unlock';wipeTransient();CaveView.unmount();Loop.stop();session=null;render();window.scrollTo(0,0);toast('Backup restored. Log in with its original username and password.');
    });
  }
  else if(act==='erase'){confirmModal('Erase all your data?','This deletes your vault from this device. It can\'t be undone unless you saved a backup.','Erase everything',function(){clearTimeout(idleT);eraseVault();wipeTransient();CaveView.unmount();Loop.stop();session=null;ui.authMode='create';render();window.scrollTo(0,0);toast('Everything erased.')})}
});
function wizField(t){
  if(!ui.wiz||!session||t.dataset.row==null)return false;
  var list=ui.wiz[t.dataset.list];if(!list||!list[+t.dataset.row])return false;
  list[+t.dataset.row][t.dataset.f]=t.value;var tt=$('#wizTotal');if(tt&&ui.wiz.step===0)tt.textContent=wizCaveTotal(ui.wiz);return true;
}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='aPw'&&ui.authMode==='create'){var m=$('#pwMeter');if(m){if(!t.value)m.textContent='At least 10 characters. A few random words works well.';else{var r=pwStrength(t.value);m.textContent='Strength: '+r[0]}}return}
  if(t.id==='exactAmt'){ui.exact=t.value;return}
  wizField(t);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='showPw'){var ty=t.checked?'text':'password';['aPw','aPw2'].forEach(function(i){var el=document.getElementById(i);if(el)el.type=ty})}
  else if(t.id==='tgt'&&session){ui.target=t.value;redrawInfo()}
  else wizField(t);
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var id=e.target.id;
  if(id==='aUser'||id==='aPw'||id==='aPw2'){e.preventDefault();ui.authMode==='create'?createAccount():unlockVault()}
  else if(id==='amtIn'&&session){e.preventDefault();hatchAmount()}
  else if(ui.wiz&&session&&e.target.closest&&e.target.closest('.wizard')&&e.target.tagName==='INPUT'){e.preventDefault();wizNext()}
});

/* ---------- render ---------- */
function render(){
  var root=$('#app'),y=window.pageYOffset||0;
  Loop.stop();Loop.clear();CaveView.unmount();
  if(!session){root.innerHTML=authHTML();bindSprites(root);Loop.start();return}
  var p=session.profile;
  if(!p.onboarded&&!session.guest){if(!ui.wiz)ui.wiz=newWizard();root.innerHTML=wizardHTML();bindSprites(root);Loop.start();return}
  if(!ui.sel)ui.sel=new Set();
  root.innerHTML=homeHTML(p);mountCave();refresh(false);Loop.start();window.scrollTo(0,y);
}
/* ---------- boot ---------- */
(function(){var v=readVault();ui.authMode=v?'unlock':'create';TIERS.forEach(function(t){ui.next[t]=Math.floor(Math.random()*4)});render()})();


})();
</script>
